AWSTemplateFormatVersion: '2010-09-09'
Description: Tram circular route - Milestones 1-5 (EC2 worker + DynamoDB + S3 artifacts)

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in the VPC above
  ArtifactBucket:
    Type: String
    Description: S3 bucket that holds the app files (created by deploy.sh)
  InstanceType:
    Type: String
    Default: t3.micro
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  RidesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: tram-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: TramState
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt StateTable.Arn
              - Sid: Accounts
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt UsersTable.Arn
              - Sid: LoginSessions
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt SessionsTable.Arn
              - Sid: Rides
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Scan]
                Resource: !GetAtt RidesTable.Arn
              - Sid: ReadAppFiles
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${ArtifactBucket}/app/*
              - Sid: ListAppFiles
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${ArtifactBucket}

  WorkerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WorkerRole]

  WorkerSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP access to the tram page
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  WorkerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref WorkerProfile
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref WorkerSG]
      Tags:
        - Key: Name
          Value: tram-worker
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -x
          dnf install -y python3-boto3
          mkdir -p /opt/tram
          cat > /etc/tram.env <<EOF
          TABLE_STATE=${StateTable}
          TABLE_USERS=${UsersTable}
          TABLE_SESSIONS=${SessionsTable}
          TABLE_RIDES=${RidesTable}
          AWS_REGION=${AWS::Region}
          AWS_DEFAULT_REGION=${AWS::Region}
          EOF
          cat > /etc/systemd/system/tram.service <<EOF
          [Unit]
          Description=Tram circular route worker
          After=network-online.target
          Wants=network-online.target

          [Service]
          EnvironmentFile=/etc/tram.env
          ExecStartPre=-/usr/bin/aws s3 sync s3://${ArtifactBucket}/app /opt/tram --delete
          ExecStart=/usr/bin/python3 /opt/tram/app.py
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable --now tram

Outputs:
  PublicUrl:
    Value: !Sub http://${WorkerInstance.PublicIp}/
  InstanceId:
    Value: !Ref WorkerInstance
  RidesTable:
    Value: !Ref RidesTable
  StateTable:
    Value: !Ref StateTable
  UsersTable:
    Value: !Ref UsersTable
  SessionsTable:
    Value: !Ref SessionsTable
